</head>
<body>

    <!-- HEADER -->

        <div class="logo">

        <nav>

        <input type="text"

           placeholder="Nombre del titular">

           id="tarjeta"

    <input type="text"
           id="fecha"

           id="cvv"
           placeholder="Codigo de seguridad">

    <button onclick="comprar()">
